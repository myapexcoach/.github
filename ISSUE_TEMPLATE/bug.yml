name: Bug
description: Something is broken or behaving wrongly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste athlete data, tokens, passwords or keys into this issue.
        Use a test account and describe the data instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website
        - Mobile app
        - Backend
        - Infra
        - Jarvis
        - Docs
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - All
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - Blocker (cannot ship or use the app)
        - High (major feature broken)
        - Medium (annoying, has a workaround)
        - Low (cosmetic or minor)
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Version and build where you saw it
      placeholder: "1.3.0 (28)"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else (screenshots, logs, links)
